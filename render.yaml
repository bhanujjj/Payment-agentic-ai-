services:
  - type: web
    name: payment-agentic-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AGENT_MODE
        value: production
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/metrics
